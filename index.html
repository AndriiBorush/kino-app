<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Кино">
<meta name="theme-color" content="#0b0d12">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Кино</title>
<style>
:root{--bg:#0b0d12;--card:#12151c;--line:#1f232d;--key:#171a22;--text:#eef0f4;--muted:#8a909c;--gold:#d6b48a;--red:#e5484d;--green:#4cc38a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
header{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top) + 12px) 16px 10px;background:rgba(11,13,18,.92);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-.4px}
.iconbtn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px}
/* Страница всегда выше экрана: на короткой iPhone с экрана «Домой» ставит нижнюю панель выше, чем нужно */
body{min-height:calc(100vh + 1px);min-height:calc(100lvh + 1px)}
main{padding:calc(env(safe-area-inset-top) + 74px) 16px calc(env(safe-area-inset-bottom) + 76px)}
nav{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;align-items:flex-start;box-sizing:border-box;height:calc(56px + env(safe-area-inset-bottom));padding:6px 8px 0;transform:translateZ(0);background:rgba(11,13,18,.94);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);padding:2px 0}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--gold)}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:16px}
.seg button{flex:1;height:36px;border-radius:9px;font-size:15px;color:var(--muted)}
.seg button.on{background:#262b36;color:var(--text);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px}
.tile{text-align:left;min-width:0}
.poster{width:100%;aspect-ratio:2/3;border-radius:10px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);font-size:12px;text-align:center;padding:6px;overflow:hidden;position:relative}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile .t{font-size:13px;margin-top:6px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .s{font-size:12px;color:var(--muted);margin-top:2px}
.empty{color:var(--muted);text-align:center;padding:60px 20px;line-height:1.5}
.count{color:var(--muted);font-size:14px;margin:0 0 14px}
.sec{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:24px 0 10px}
.row{display:flex;gap:12px;align-items:center;padding:10px;border-radius:14px;background:var(--card);border:1px solid var(--line);margin-bottom:10px;width:100%}
.row .poster{width:56px;flex:none;border-radius:8px}
.row .info{flex:1;min-width:0;text-align:left}
.row .t{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;color:var(--muted);margin-top:3px}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold)}
.tplus{position:absolute;right:6px;bottom:6px;padding:6px 10px;border-radius:10px;background:rgba(14,16,20,.85);border:1px solid var(--line);color:var(--gold);font-weight:600;font-size:14px;z-index:2}
.plus{flex:none;width:52px;height:44px;border-radius:12px;background:var(--key);border:1px solid var(--line);color:var(--gold);font-weight:600;font-size:15px}
.sbox{position:relative;margin-bottom:16px}
.sbox .search{margin-bottom:0;padding-right:48px}
.search::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;display:none;place-items:center;color:var(--muted)}
.clr.on{display:grid}
.clr span{width:22px;height:22px;border-radius:50%;background:#3a3f4c;display:grid;place-items:center;color:var(--text)}
.clr svg{width:12px;height:12px}
.search{width:100%;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:17px;padding:0 14px;outline:none;margin-bottom:16px;-webkit-appearance:none}
.search:focus{border-color:#3a3f4c}
.mark{font-size:12px;color:var(--gold)}
/* Подборки */
.shelf h3{margin:26px 0 12px;font-size:20px;letter-spacing:-.2px}
.shelf:first-child h3{margin-top:4px}
.shelf .sub{color:var(--muted);font-size:13px;margin:-8px 0 12px}
.scroller{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:0 16px;scroll-snap-type:x proximity;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.scroller .tile{flex:none;width:112px;scroll-snap-align:start}
/* Карточка фильма */
.layer{position:fixed;inset:0;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;transform:translateY(100%);transition:transform .28s ease;-webkit-overflow-scrolling:touch}
.layer.side{transform:translateX(100%)}
.layer.open{transform:none}
.shelf h3 .cnt,.psec h3 .cnt{margin-left:10px;padding:2px 10px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--muted);font-size:14px;font-weight:600;vertical-align:middle}
.psec{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 12px;margin-top:18px}
.psec h3{margin:0 0 14px 4px;font-size:22px;letter-spacing:-.3px}
.psec h3 .cnt{background:var(--key)}
.psec .poster{background:var(--key)}
.pagehead{text-align:center;margin-bottom:22px}
.pagehead .emo{font-size:56px;line-height:1}
.pagehead h2{margin:12px 0 0;font-size:24px;letter-spacing:-.3px}
.pagehead .s{color:var(--muted);font-size:15px;margin-top:6px}
.colhead{display:flex;align-items:center;gap:10px;margin:20px 0 14px}
.colhead h3{margin:0;font-size:24px;letter-spacing:-.3px}
.colhead span{padding:4px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--muted);font-size:14px;font-weight:600}
.col{display:block;width:100%;text-align:center;padding:22px 16px 18px;margin-bottom:12px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.col .emo{font-size:40px;line-height:1}
.col .ct{font-size:19px;font-weight:600;margin-top:12px;letter-spacing:-.2px;line-height:1.25}
.col .cn{color:var(--muted);font-size:15px;margin-top:6px}
.dragging{transition:none!important}
.face.big{width:140px;height:140px;font-size:40px}
hr.split{border:0;border-top:1px solid var(--line);margin:28px 0 4px}
button.person{display:block}
.hero{padding:calc(env(safe-area-inset-top) + 64px) 16px 0;text-align:center}
.hero .poster{width:180px;margin:0 auto;border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.55)}
.hero h2{margin:18px 0 0;font-size:24px;line-height:1.2;letter-spacing:-.3px}
.hero .s{color:var(--muted);font-size:15px;margin-top:6px}
.play{position:absolute;right:10px;bottom:10px;z-index:2;width:46px;height:46px;border-radius:50%;background:rgba(110,114,122,.82);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:grid;place-items:center;color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.play svg{width:22px;height:22px;margin-left:3px}
.play:active{transform:scale(.94)}
.close{position:fixed;top:calc(env(safe-area-inset-top) + 10px);right:16px;z-index:11}
.body{padding:20px 16px calc(env(safe-area-inset-bottom) + 30px)}
.btns{display:flex;gap:10px}
.btns button{flex:1;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:15px}
.btns button.on{background:var(--gold);color:#16120c;border-color:var(--gold)}
.ov{color:#c3c8d1;line-height:1.55;font-size:15px;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{padding:7px 12px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-size:14px}
.people{display:flex;gap:14px;overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:none}
.people::-webkit-scrollbar{display:none}
.person{flex:none;width:82px;text-align:center}
.face{width:72px;height:72px;margin:0 auto;border-radius:50%;background:var(--card);border:1px solid var(--line);overflow:hidden;position:relative;display:grid;place-items:center;color:var(--muted);font-size:20px;font-weight:600}
.face img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.person .n{font-size:13px;margin-top:6px;line-height:1.25}
.person .r{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.season{border:1px solid var(--line);border-radius:14px;background:var(--card);margin-bottom:10px;overflow:hidden}
.season .head{display:flex;justify-content:space-between;align-items:center;width:100%;padding:14px;font-size:16px}
.season .head span{color:var(--muted);font-size:14px}
.eps{display:none;padding:0 14px 14px}
.season.open .eps{display:block}
.epgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.epgrid button{height:40px;border-radius:9px;background:var(--key);border:1px solid var(--line);font-size:14px}
.epgrid button.on{background:var(--green);color:#06120c;border-color:var(--green);font-weight:600}
.season .head b{font-weight:400}
.season .head small{color:var(--muted);font-size:14px}
.season.soon{border-style:dashed;background:none}
.season.soon .head span{color:var(--gold)}
.season.soon .eps{padding-top:0}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.dot.live{background:var(--green);box-shadow:0 0 8px rgba(76,195,138,.7)}
.dot.wait{background:var(--gold)}
.dot.end{background:#8a909c}
.poster .dot{position:absolute;top:7px;right:7px;width:10px;height:10px;z-index:1;border:2px solid rgba(11,13,18,.85);box-sizing:content-box}
.status{display:inline-flex;align-items:center;gap:8px;margin-top:12px;padding:7px 14px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-size:14px}
.status.live{color:#9fe3c0}.status.wait{color:var(--gold)}.status.end{color:var(--muted)}
.eplist{display:flex;flex-direction:column}
.ep{display:flex;align-items:center;gap:12px;width:100%;padding:10px 0;border-top:1px solid var(--line);text-align:left}
.ep:first-child{border-top:0}
.chk{width:22px;height:22px;flex:none;border-radius:50%;border:1.5px solid #3a3f4c;display:grid;place-items:center}
.ep.on .chk{background:var(--green);border-color:var(--green)}
.ep.on .chk::after{content:'';width:9px;height:5px;border:2px solid #06120c;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.en{flex:1;min-width:0;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.en b{display:inline-block;min-width:24px;font-weight:600;color:var(--muted);margin-right:6px}
.ed{flex:none;font-size:14px;color:var(--muted)}
.ep.future{cursor:default}
.ep.future .chk{border-style:dashed;opacity:.5}
.ep.future .en{color:var(--muted)}
.ep.future .ed{color:var(--gold)}
.all{margin-top:10px;font-size:14px;color:var(--gold)}
.folders{margin-bottom:16px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.folders::-webkit-scrollbar{display:none}
.chips button{flex:none;padding:7px 14px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-size:14px;white-space:nowrap}
.chips button.on{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:600}
.airbar{display:flex;justify-content:center;gap:8px;margin-bottom:14px}
.airbar button{padding:7px 14px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-size:14px}
.airbar button.on{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:600}
.chips button.add{color:var(--muted);border-style:dashed}
.chips button.pen{display:grid;place-items:center;padding:0;width:40px}
.chips button.pen svg{width:17px;height:17px}
.genres button.on{background:rgba(229,72,77,.14);color:#ff8a8d;border-color:rgba(229,72,77,.5);text-decoration:line-through;font-weight:400}
.stats .big{font-size:44px;font-weight:700;letter-spacing:-1px;line-height:1.1;margin-top:4px}
.stats .big span{font-size:20px;font-weight:600;letter-spacing:0;color:var(--muted)}
.stats .sub{color:var(--muted);font-size:14px;margin-top:4px}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.sgrid div{background:var(--key);border:1px solid var(--line);border-radius:14px;padding:12px}
.sgrid b{display:block;font-size:24px}
.sgrid span{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.stats .sec{margin-top:20px}
.stats .people{margin:0 -16px;padding:0 16px}
.hrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.hrow span{flex:1;min-width:0;font-size:15px}
.hrow small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.hrow button{padding:7px 12px;border-radius:10px;background:var(--key);border:1px solid var(--line);color:var(--gold);font-size:14px}
.bottom2{display:flex;gap:10px;margin-top:28px}
.bottom2 .hide{flex:1;margin-top:0;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.bottom2 .sim{color:var(--text)}
.hide{margin-top:28px;color:var(--muted);font-size:15px;width:100%;text-align:center;padding:12px}
.del{margin-top:28px;color:var(--red);font-size:15px;width:100%;text-align:center;padding:12px}
.hint{color:var(--muted);font-size:14px}
/* Настройки */
.field{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--key);color:var(--text);font-size:15px;padding:0 12px;outline:none;-webkit-appearance:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.card p{margin:0 0 10px;color:var(--muted);font-size:14px;line-height:1.45}
.card a{color:var(--gold)}
.wide{width:100%;height:46px;border-radius:12px;background:var(--key);border:1px solid var(--line);font-weight:600;margin-top:8px}
#dlg{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:24px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#dlg.open{display:flex}
.dbox{width:100%;max-width:340px;background:#171a22;border:1px solid var(--line);border-radius:20px;padding:20px}
.dbox h3{margin:0;font-size:18px;text-align:center}
.dbox p{margin:8px 0 0;color:var(--muted);font-size:14px;line-height:1.45;text-align:center}
.dbox .field{margin-top:16px;font-size:16px}
.dbtns{display:flex;gap:10px;margin-top:18px}
.dbtns button{flex:1;height:46px;border-radius:12px;background:var(--key);border:1px solid var(--line);font-weight:600}
.dbtns .okb{background:var(--gold);color:#16120c;border-color:var(--gold)}
.dbtns .danger{background:var(--red);color:#fff;border-color:var(--red)}
.dextra{display:block;width:100%;margin-top:12px;padding:8px;color:var(--red);font-size:15px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 92px);transform:translateX(-50%);background:#252a35;color:var(--text);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;z-index:20;pointer-events:none}
#toast.on{opacity:1}
</style>
</head>
<body>
<header><h1 id="title"></h1>
<button class="iconbtn" id="gear" aria-label="Настройки"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</header>
<main id="main"></main>
<nav>
<button data-tab="want" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h12v18l-6-4-6 4z"/></svg>Посмотрю</button>
<button data-tab="watched"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>Просмотрено</button>
<button data-tab="lists"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Подборки</button>
<button data-tab="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>Поиск</button>
</nav>
<div id="toast"></div>
<div id="dlg"></div>
<input type="file" id="file" accept=".json,application/json" hidden>
<script>
const KEY = 'kino-data', TMDB = 'https://api.themoviedb.org/3', IMG = 'https://image.tmdb.org/t/p/';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let db = load(), tab = 'want', query = '', results = null, searchTimer;
const seg = { want: 'tv', watched: 'movie', lists: 'movie' }; // при открытии — «Посмотрю → Сериалы»
const pool = {}; // всё, что пришло из TMDB (поиск, подборки) — чтобы открыть карточку

function load() {
  try { const d = JSON.parse(localStorage.getItem(KEY)); if (d && d.items) return d; } catch {}
  return { key: '', items: {}, showsChecked: 0 };
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch { toast('Не удалось сохранить'); } }
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('on'), 2000); }
const uid = (type, id) => type + '-' + id;
const year = d => (d || '').slice(0, 4);
const poster = (p, size = 'w342') => p ? IMG + size + p : '';

// ---------- TMDB ----------
async function api(path, params = {}) {
  if (!db.key) throw new Error('nokey');
  const q = new URLSearchParams({ language: 'ru-RU', ...params });
  const opt = {};
  if (db.key.length > 40) opt.headers = { Authorization: 'Bearer ' + db.key }; else q.set('api_key', db.key);
  const r = await fetch(TMDB + path + '?' + q, opt);
  if (r.status === 401) throw new Error('badkey');
  if (!r.ok) throw new Error('net');
  return r.json();
}

function ask({ title, text = '', input = false, value = '', ok = 'Готово', danger = false, extra = '' }) {
  return new Promise(done => {
    const el = $('#dlg');
    el.innerHTML = `<div class="dbox"><h3>${esc(title)}</h3>${text ? `<p>${esc(text)}</p>` : ''}${input ? `<input class="field" id="dlgin" value="${esc(value)}" autocomplete="off" maxlength="40">` : ''}

    el.classList.add('open');
    // Фокус сразу, в том же нажатии: иначе iPhone не откроет клавиатуру
    const inp = $('#dlgin'); if (inp) { inp.focus(); inp.select(); inp.onkeydown = e => { if (e.key === 'Enter') finish('ok'); }; }
    function finish(a) { el.classList.remove('open'); el.onclick = null; done(a === 'ok' ? (input ? inp.value.trim() || null : true) : a === 'extra' ? 'extra' : null); }

  });
}

    (it.crew || []).filter(p => p.role === 'Режиссёр' || p.role === 'Создатель').forEach(p => add(makers, p, it));
  }
  const top = m => Object.values(m).filter(p => p.n >= 2).sort((a, b) => b.n - a.n).slice(0, 10);
  return { movieMin, showMin, movies, eps, approx, actors: top(actors), makers: top(makers) };
}
function statsHtml() {
  const st = stats(), total = st.movieMin + st.showMin;
  const hm = m => Math.floor(m / 60).toLocaleString('ru') + ' ч' + (m % 60 ? ' ' + m % 60 + ' мин' : '');
  const fmtN = (n, a, b, c) => n.toLocaleString('ru') + ' ' + plural(n, a, b, c);
  if (!st.movies && !st.eps) return `<div class="card"><p style="margin:0">Статистика появится, когда отметишь просмотренные фильмы или серии.</p></div>`;
  const ppl = list => people(list.map(p => ({ ...p, role: fmtN(p.n, 'просмотр', 'просмотра', 'просмотров') })));
  return `<div class="card stats"><p>Моя статистика${st.approx ? ' · примерно' : ''}</p>
    <div class="big">${Math.round(total / 60).toLocaleString('ru')}<span> ${plural(Math.round(total / 60), 'час', 'часа', 'часов')}</span></div>
    <div class="sub">${total.toLocaleString('ru')} ${plural(total, 'минута', 'минуты', 'минут')} · ${(total / 1440).toFixed(1).replace('.', ',')} суток</div>
    <div class="sgrid"><div><b>${st.movies}</b><span>${plural(st.movies, 'фильм', 'фильма', 'фильмов')} · ${hm(st.movieMin)}</span></div><div><b>${st.eps}</b><span>${plural(st.eps, 'серия', 'серии', 'серий')} · ${hm(st.showMin)}</span></div></div>
    ${st.actors.length ? `<div class="sec">Любимые актёры</div>${ppl(st.actors)}` : ''}
    ${st.makers.length ? `<div class="sec">Любимые режиссёры и создатели</div>${ppl(st.makers)}` : ''}
    ${!st.actors.length && !st.makers.length ? `<p style="margin:18px 0 0">Любимые актёры и режиссёры появятся, когда кто-то встретится хотя бы в двух просмотренных фильмах или сериалах.</p>` : ''}</div>`;
}
async function openSettings() {
  const L = topLayer() && topLayer().kind === 'settings' ? topLayer() : pushLayer('settings');
  let est = '';
  try { const e = await navigator.storage.estimate(); est = `Приложение занимает около ${(e.usage / 1048576).toFixed(1)} МБ.`; } catch {}
  const n = Object.keys(db.items).length, hid = Object.values(db.hiddenItems || {}).sort((a, b) => b.at - a.at);
  const y = L.el.scrollTop;
  L.el.innerHTML = `<button class="iconbtn close" id="x" aria-label="Закрыть"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  <div class="body" style="padding-top:calc(env(safe-area-inset-top) + 64px)"><h2 style="margin:0 0 18px">Настройки</h2>${statsHtml()}
  <div class="card"><p>Ключ TMDB нужен для поиска, подборок и обложек. Бесплатно: зарегистрируйся на <a href="https://www.themoviedb.org/settings/api" target="_blank" rel="noopener">themoviedb.org</a> → Настройки → API. Подойдёт «API Key» или «API Read Access Token».</p>
  <input class="field" id="key" placeholder="Вставь ключ" value="${esc(db.key)}" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="wide" id="savekey">Сохранить ключ</button></div>
  <div class="card"><p>Скрытые жанры — пропадают из поиска, подборок и фильмографий актёров. Твои списки не трогаются.</p><div class="chips genres">${GENRES.map(g => `<button data-genre="${g.k}" class="${(db.offGenres || []).includes(g.k) ? 'on' : ''}">${g.t}</button>`).join('')}</div></div>
  <div class="card"><p>Спрятанные фильмы и сериалы${hid.length ? ' · ' + hid.length : ''}</p>${hid.length ? hid.map(x => `<div class="hrow"><span>${esc(x.title)}<small>${x.year || ''}${x.type === 'tv' ? ' · сериал' : ''}</small></span><button data-unhide="${uid(x.type, x.id)}">Вернуть</button></div>`).join('') : '<p style="margin:0">Пока ничего. Спрятать можно кнопкой внизу карточки.</p>'}</div>
  <div class="card"><p>В списках ${n}. ${est}</p><p>Все данные хранятся только на этом телефоне. Если удалить иконку приложения, они пропадут — поэтому иногда сохраняй копию (например, в iCloud Drive).</p>
  <button class="wide" id="exp">Сохранить копию</button><button class="wide" id="imp">Восстановить из копии</button></div>
  <p style="color:var(--muted);font-size:12px;text-align:center;line-height:1.5">Данные о фильмах: TMDB. Это приложение использует TMDB API, но не одобрено и не сертифицировано TMDB.</p></div>`;
  L.el.scrollTop = y;
}
async function exportData() {
  const data = JSON.stringify({ app: 'kino', saved: new Date().toISOString(), items: db.items, folders: db.folders || [], hiddenItems: db.hiddenItems || {}, offGenres: db.offGenres || [] }, null, 1);
  const name = 'kino-' + new Date().toISOString().slice(0, 10) + '.json';
  const file = new File([data], name, { type: 'application/json' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file] }); return; } catch (e) { if (e.name === 'AbortError') return; } }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
$('#file').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!d.items || typeof d.items !== 'object') throw 0;
    if (!await ask({ title: 'Восстановить из копии?', text: `${Object.keys(d.items).length} записей. Текущие списки заменятся.`, ok: 'Восстановить', danger: true })) return;
    db.items = d.items; if (d.folders) db.folders = d.folders; if (d.hiddenItems) db.hiddenItems = d.hiddenItems; if (d.offGenres) db.offGenres = d.offGenres; save(); closeSheet(); syncAll(); toast('Восстановлено');
  } catch { toast('Это не файл копии'); }
});

// ---------- Нажатия ----------
document.querySelector('nav').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setTab(b.dataset.tab); });
$('#gear').addEventListener('click', openSettings);
$('#main').addEventListener('click', e => {
  const fb = e.target.closest('[data-folder]');
  if (fb) { const v = fb.dataset.folder;
    if (v === 'edit') return editFolder();
    if (v === 'new') { newFolder().then(f => { if (f) { folderSel[tab] = f.id; render(); toast('Подборка создана'); } }); return; }
    folderSel[tab] = v || null;
    const y = scrollY; render(); scrollTo(0, y); return; }
  const ab = e.target.closest('[data-air]'); if (ab) { airF = airF === ab.dataset.air ? 'all' : ab.dataset.air; try { localStorage.setItem('kino-air', airF); } catch {} const y = scrollY; render(); scrollTo(0, y); return; }
  const sg = e.target.closest('[data-seg]'); if (sg) { seg[tab] = sg.dataset.seg; const y = scrollY; render(); scrollTo(0, y); return; }
  const cl = e.target.closest('[data-col]'); if (cl) return openCollection(+cl.dataset.col);
  const nx = e.target.closest('[data-next]');
  if (nx) { const it = db.items['tv-' + nx.dataset.next], n = nextEp(it); if (n) { toggleEp(it, n.s, n.e); toast(`Сезон ${n.s}, серия ${n.e} — просмотрена`); render(); } return; }
  const o = e.target.closest('[data-open]'); if (o) openItem(o.dataset.open);
});
function layerClick(e, L) {
  const t = e.target.closest('button'); if (!t) return;
  if (t.classList.contains('close')) return popLayer(L);
  if (t.dataset.open) return openItem(t.dataset.open);
  if (t.dataset.pname !== undefined) return openPerson(+t.dataset.pid || 0, t.dataset.pname);
  if (L.kind !== 'item' && L.kind !== 'settings') return;
  if (t.id === 'savekey') { db.key = $('#key').value.trim(); db.showsChecked = 0; db.disc = null; save(); results = null; toast('Ключ сохранён'); syncAll(); return; }
  if (t.id === 'exp') return exportData();
  if (t.id === 'imp') return $('#file').click();
  if (t.dataset.tofolder) {
    const id = uid(cur.type, cur.id), it = cur;
    if (t.dataset.tofolder === 'new') { newFolder().then(f => { if (!f) return; f.items.push(id); save(); if (cur === it) renderSheet(); toast(`Добавлено в «${f.name}»`); }); return; }
    const f = (db.folders || []).find(x => x.id === t.dataset.tofolder); if (!f) return;
    const i = f.items.indexOf(id); if (i >= 0) f.items.splice(i, 1); else f.items.push(id);
    save(); renderSheet(); return;
  }
  if (t.id === 'similar') return openSimilar(cur);
  if (t.id === 'hide') {
    const id = uid(cur.type, cur.id); db.hiddenItems = db.hiddenItems || {};
    if (db.hiddenItems[id]) { delete db.hiddenItems[id]; save(); toast('Возвращено'); renderSheet(); return; }
    const it = cur;
    ask({ title: 'Спрятать?', text: `«${it.title}» пропадёт отовсюду. Вернуть можно в настройках.`, ok: 'Спрятать' }).then(yes => {
      if (!yes) return;
      db.hiddenItems[id] = { id: it.id, type: it.type, title: it.title, year: it.year, poster: it.poster, at: Date.now() };
      save(); closeSheet(); toast('Спрятано');
    }); return;
  }
  if (t.dataset.unhide) { delete db.hiddenItems[t.dataset.unhide]; save(); openSettings(); return; }
  if (t.dataset.genre) { const k = t.dataset.genre, off = db.offGenres = db.offGenres || [], i = off.indexOf(k); if (i >= 0) off.splice(i, 1); else off.push(k); save(); results = null; t.classList.toggle('on'); return; }
  if (t.dataset.st) return setStatus(t.dataset.st);
  if (t.dataset.season) { const n = +t.dataset.season; openSeason = openSeason === n ? null : n; renderSheet(); return; }
  if (t.dataset.ep) { const [s, ep] = t.dataset.ep.split(':').map(Number); toggleEp(cur, s, ep); renderSheet(); return; }
  if (t.dataset.all) {
    const s = +t.dataset.all, ac = airedCount(cur, cur.seasons.find(x => x.n === s)); cur.seen = cur.seen || {};
    const on = (cur.seen[s] || []).length < ac;
    cur.seen[s] = on ? Array.from({ length: ac }, (_, i) => i + 1) : [];
    // Отметил весь сезон — значит, видел и все прошлые (кроме спецвыпусков, сезон 0); снятие отметки прошлые не трогает
    if (on && s > 1) airedSeasons(cur).filter(x => x.n >= 1 && x.n < s).forEach(x => cur.seen[x.n] = Array.from({ length: airedCount(cur, x) }, (_, i) => i + 1));
    if (!cur.status) cur.status = 'want';
    afterEpisodes(cur); keep(cur); renderSheet();
  }
}

// ---------- Свайп вниз закрывает окно ----------
function swipeClose(el, close) {
  let y0 = null, dy = 0;
  el.addEventListener('touchstart', e => { if (el.scrollTop <= 0 && el.classList.contains('open')) { y0 = e.touches[0].clientY; dy = 0; } else y0 = null; }, { passive: true });
  el.addEventListener('touchmove', e => {
    if (y0 === null) return;
    dy = e.touches[0].clientY - y0;
    if (dy <= 0 || el.scrollTop > 0) { el.classList.remove('dragging'); el.style.transform = ''; if (dy < 0) y0 = null; return; }
    e.preventDefault(); el.classList.add('dragging'); el.style.transform = `translateY(${dy}px)`;
  }, { passive: false });
  el.addEventListener('touchend', () => {
    if (y0 === null) return; y0 = null; el.classList.remove('dragging');
    if (dy > 110) { el.style.transform = 'translateY(100%)'; setTimeout(() => { close(); el.style.transform = ''; }, 250); } else el.style.transform = '';
  });
}
addEventListener('online', () => { syncAll(); if (tab === 'search') doSearch(); if (tab === 'lists') refreshMain(); });
addEventListener('offline', () => { if (tab === 'search') renderResults(); });

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
render(); syncAll();
</script>
