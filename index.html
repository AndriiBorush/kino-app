<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Кино">
<meta name="theme-color" content="#0b0d12">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Кино</title>
<style>
:root{--bg:#0b0d12;--card:#12151c;--line:#1f232d;--key:#171a22;--text:#eef0f4;--muted:#8a909c;--gold:#d6b48a;--red:#e5484d;--green:#4cc38a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
header{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top) + 12px) 16px 10px;background:rgba(11,13,18,.92);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-.4px}
.iconbtn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px}
/* Страница всегда выше экрана: на короткой iPhone с экрана «Домой» ставит нижнюю панель выше, чем нужно */
body{min-height:calc(100vh + 1px);min-height:calc(100lvh + 1px)}
main{padding:calc(env(safe-area-inset-top) + 74px) 16px calc(env(safe-area-inset-bottom) + 76px)}
nav{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;align-items:flex-start;box-sizing:border-box;height:calc(56px + env(safe-area-inset-bottom));padding:6px 8px 0;transform:translateZ(0);background:rgba(11,13,18,.94);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);padding:2px 0}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--gold)}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:16px}
.seg button{flex:1;height:36px;border-radius:9px;font-size:15px;color:var(--muted)}
.seg button.on{background:#262b36;color:var(--text);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px}
.tile{text-align:left;min-width:0;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.tile img{-webkit-touch-callout:none;pointer-events:none}
/* Зажатие на постере — быстрое окно с двумя кнопками */
#qp{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);opacity:0;transition:opacity .18s}
#qp.on{opacity:1}
#qp .qimg{width:min(58vw,260px);aspect-ratio:2/3;border-radius:16px;overflow:hidden;background:var(--card);box-shadow:0 20px 50px rgba(0,0,0,.5);transform:scale(.92);transition:transform .18s}
#qp.on .qimg{transform:scale(1)}
#qp .qimg img{width:100%;height:100%;object-fit:cover;display:block}
#qp .qt{font-weight:600;font-size:17px;text-align:center;max-width:280px}
#qp .qb{display:flex;gap:10px;width:min(80vw,320px)}
#qp .qb button{flex:1;padding:14px 8px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:15px;color:var(--text)}
#qp .qb button.on{background:var(--text);color:var(--bg)}
.poster{width:100%;aspect-ratio:2/3;border-radius:10px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);font-size:12px;text-align:center;padding:6px;overflow:hidden;position:relative}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile .t{font-size:13px;margin-top:6px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .s{font-size:12px;color:var(--muted);margin-top:2px}
.empty{color:var(--muted);text-align:center;padding:60px 20px;line-height:1.5}
.count{color:var(--muted);font-size:14px;margin:0 0 14px}
.lsec{border:1px solid var(--line);border-radius:18px;padding:14px 12px 2px;margin:4px -4px 18px;background:var(--card)}
.lsec.go{border-color:rgba(95,211,154,.45);background:linear-gradient(180deg,rgba(95,211,154,.10),var(--card) 120px)}
.lhd{display:flex;align-items:center;gap:8px;margin:0 2px 12px;font-size:20px;font-weight:700;letter-spacing:-.2px}
.lhd i{width:9px;height:9px;border-radius:50%;background:var(--gold)}
.lsec.go .lhd i{background:#5fd39a}
.lsec.no{border-color:rgba(255,90,90,.5);background:linear-gradient(180deg,rgba(255,90,90,.10),var(--card) 120px)}
.lsec.no .lhd i{background:#ff5a5a}
.lsec.flat{border:0;background:none;padding:0 4px;margin:4px 0 18px}
.lsec.flat .lhd i{display:none}
.sec{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:24px 0 10px}
.row{display:flex;gap:12px;align-items:center;padding:10px;border-radius:14px;background:var(--card);border:1px solid var(--line);margin-bottom:10px;width:100%}
.row .poster{width:56px;flex:none;border-radius:8px}
.row .info{flex:1;min-width:0;text-align:left}
.row .t{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;color:var(--muted);margin-top:3px}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold)}
.tplus{position:absolute;right:6px;bottom:6px;padding:6px 10px;border-radius:10px;background:rgba(14,16,20,.85);border:1px solid var(--line);color:var(--gold);font-weight:600;font-size:14px;z-index:2}
.plus{flex:none;width:52px;height:44px;border-radius:12px;background:var(--key);border:1px solid var(--line);color:var(--gold);font-weight:600;font-size:15px}
.sbox{position:relative;margin-bottom:16px}
.sbox .search{margin-bottom:0;padding-right:48px}
.search::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;display:none;place-items:center;color:var(--muted)}
.clr.on{display:grid}
.clr span{width:22px;height:22px;border-radius:50%;background:#3a3f4c;display:grid;place-items:center;color:var(--text)}
.clr svg{width:12px;height:12px}
.search{width:100%;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:17px;padding:0 14px;outline:none;margin-bottom:16px;-webkit-appearance:none}
.search:focus{border-color:#3a3f4c}
.mark{font-size:12px;color:var(--gold)}
/* Подборки */
.shelf h3{margin:26px 0 12px;font-size:20px;letter-spacing:-.2px}
.shelf:first-child h3{margin-top:4px}
.shelf .sub{color:var(--muted);font-size:13px;margin:-8px 0 12px}
.scroller{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:0 16px;scroll-snap-type:x proximity;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.scroller .tile{flex:none;width:112px;scroll-snap-align:start}
/* Карточка фильма */
.layer{position:fixed;inset:0;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;transform:translateY(100%);transition:transform .28s ease;-webkit-overflow-scrolling:touch}
.layer.side{transform:translateX(100%)}
.layer.open{transform:none}
.shelf h3 .cnt,.psec h3 .cnt{margin-left:10px;padding:2px 10px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--muted);font-size:14px;font-weight:600;vertical-align:middle}
.psec{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 12px;margin-top:18px}
.psec h3{margin:0 0 14px 4px;font-size:22px;letter-spacing:-.3px}
.psec h3 .cnt{background:var(--key)}
.psec .poster{background:var(--key)}
.pagehead{text-align:center;margin-bottom:22px}
.pagehead .emo{font-size:56px;line-height:1}
.pagehead h2{margin:12px 0 0;font-size:24px;letter-spacing:-.3px}
.pagehead .s{color:var(--muted);font-size:15px;margin-top:6px}
.colhead{display:flex;align-items:center;gap:10px;margin:20px 0 14px}
.colhead h3{margin:0;font-size:24px;letter-spacing:-.3px}
.colhead span{padding:4px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--muted);font-size:14px;font-weight:600}
.col{display:block;width:100%;text-align:center;padding:22px 16px 18px;margin-bottom:12px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.col .emo{font-size:40px;line-height:1}
.col .ct{font-size:19px;font-weight:600;margin-top:12px;letter-spacing:-.2px;line-height:1.25}
.col .cn{color:var(--muted);font-size:15px;margin-top:6px}
/* Смахивание коллекции: влево — в избранные, вправо — удалить */
.swp{position:relative;margin-bottom:12px;border-radius:18px;overflow:hidden}
.swp .col{margin-bottom:0;position:relative;transition:transform .2s}
.swp.dragging .col{transition:none}
.swp .bg{position:absolute;inset:0;display:flex;align-items:center;padding:0 22px;font-weight:600;font-size:16px;color:#fff;opacity:0}
.swp .bg.fav{background:#4f7cff;justify-content:flex-end}
.swp .bg.del{background:#e5484d;justify-content:flex-start}
.mkcol{margin-left:auto;padding:7px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--gold);font-size:14px;font-weight:600}
.more.del{color:#ff6b6b}
.fixgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.fixc{text-align:left;padding:16px 14px;border-radius:16px;border:1px solid var(--b);background:linear-gradient(160deg,var(--b) -60%,var(--card) 70%);min-height:96px}
.fixc .ct{font-size:19px;font-weight:700;letter-spacing:-.2px;color:var(--c)}
.fixc .cn{color:var(--muted);font-size:14px;margin-top:6px}
.oscl{margin:0;padding:0;list-style:none}
.oscl li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.oscl li:last-child{border-bottom:0}
.oscl svg{width:9px;height:20px;fill:#e2b84a;flex:none}
.dragging{transition:none!important}
.face.big{width:140px;height:140px;font-size:40px}
hr.split{border:0;border-top:1px solid var(--line);margin:28px 0 4px}
button.person{display:block}
.hero{padding:calc(env(safe-area-inset-top) + 64px) 16px 0;text-align:center}
.hero .poster{width:180px;margin:0 auto;border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.55)}
.hero h2{margin:18px 0 0;font-size:24px;line-height:1.2;letter-spacing:-.3px}
.hero .s{color:var(--muted);font-size:15px;margin-top:6px}
.play{position:absolute;right:10px;bottom:10px;z-index:2;width:46px;height:46px;border-radius:50%;background:rgba(110,114,122,.82);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:grid;place-items:center;color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.play svg{width:22px;height:22px;margin-left:3px}
.play:active{transform:scale(.94)}
.favtop{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:16px;z-index:11;width:auto;padding:0 14px;font-size:15px;font-weight:600;color:var(--text)}
.favtop.on{color:#9db6ff;border-color:#4f7cff}
.close{position:fixed;top:calc(env(safe-area-inset-top) + 10px);right:16px;z-index:11}
.body{padding:20px 16px calc(env(safe-area-inset-bottom) + 30px)}
.btns{display:flex;gap:10px}
.btns button{flex:1;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:15px}
.btns button.on{background:var(--gold);color:#16120c;border-color:var(--gold)}
.ov{color:#c3c8d1;line-height:1.55;font-size:15px;margin:0}
.made{margin:0;color:var(--muted);font-size:15px;line-height:1.45;display:flex;flex-wrap:wrap;gap:4px 14px}
.made{align-items:center}
.made b{color:var(--text);font-weight:500}
.made .logo{display:inline-flex;align-items:center;height:30px;padding:4px 10px;border-radius:8px;background:#fff}
.made .logo img{max-height:22px;max-width:110px;object-fit:contain}
.swrow{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:0;text-align:left;color:var(--text);font-size:15px}
.swrow span{flex:1}
.swrow small{display:block;color:var(--muted);font-size:13px;margin-top:3px}
.sw{flex:none;position:relative;width:51px;height:31px;border-radius:16px;background:var(--line);transition:background .2s}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.sw.on{background:#34c759}
.sw.on::after{transform:translateX(20px)}
.season{position:relative}
.season.swiping{overflow:hidden;border-radius:14px}
.season.swiping::before{content:'✓ Весь сезон';position:absolute;top:0;right:0;left:0;height:var(--hh,56px);display:flex;align-items:center;justify-content:flex-end;padding:0 18px;background:#2f6b3f;color:#fff;font-weight:600;border-radius:14px}
.season.ready::before{background:#34c759}
.season .head{position:relative;transition:transform .2s;background:var(--card)}
.season.swiping .head{transition:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{padding:7px 12px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-size:14px}
.people{display:flex;gap:14px;overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:none}
.people::-webkit-scrollbar{display:none}
.person{flex:none;width:82px;text-align:center}
.face{width:72px;height:72px;margin:0 auto;border-radius:50%;background:var(--card);border:1px solid var(--line);overflow:hidden;position:relative;display:grid;place-items:center;color:var(--muted);font-size:20px;font-weight:600}
.face img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.person .n{font-size:13px;margin-top:6px;line-height:1.25}
.person .r{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.season{border:1px solid var(--line);border-radius:14px;background:var(--card);margin-bottom:10px;overflow:hidden}
.season .head{display:flex;justify-content:space-between;align-items:center;width:100%;padding:14px;font-size:16px}
.season .head span{color:var(--muted);font-size:14px}
.eps{display:none;padding:0 14px 14px}
.season.open .eps{display:block}
.epgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.epgrid button{height:40px;border-radius:9px;background:var(--key);border:1px solid var(--line);font-size:14px}
.epgrid button.on{background:var(--green);color:#06120c;border-color:var(--green);font-weight:600}
.season .head b{font-weight:400}
.season .head small{color:var(--muted);font-size:14px}
.season.soon{border-style:dashed;background:none}
.season.soon .head span{color:var(--gold)}
.season.soon .eps{padding-top:0}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.dot.live{background:var(--green);box-shadow:0 0 8px rgba(76,195,138,.7)}
.dot.wait{background:var(--gold)}
.dot.end{background:#8a909c}
.poster .dot{position:absolute;top:7px;right:7px;width:10px;height:10px;z-index:1;border:2px solid rgba(11,13,18,.85);box-sizing:content-box}
.status{display:inline-flex;align-items:center;gap:8px;margin-top:12px;padding:7px 14px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-size:14px}
.status.live{color:#9fe3c0}.status.wait{color:var(--gold)}.status.end{color:var(--muted)}
.eplist{display:flex;flex-direction:column}
.ep{display:flex;align-items:center;gap:12px;width:100%;padding:10px 0;border-top:1px solid var(--line);text-align:left}
.ep:first-child{border-top:0}
.chk{width:22px;height:22px;flex:none;border-radius:50%;border:1.5px solid #3a3f4c;display:grid;place-items:center}
.ep.on .chk{background:var(--green);border-color:var(--green)}
.ep.on .chk::after{content:'';width:9px;height:5px;border:2px solid #06120c;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.en{flex:1;min-width:0;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.en b{display:inline-block;min-width:24px;font-weight:600;color:var(--muted);margin-right:6px}
.ed{flex:none;font-size:14px;color:var(--muted)}
.ep.future{cursor:default}
.ep.future .chk{border-style:dashed;opacity:.5}
.ep.future .en{color:var(--muted)}
.ep.future .ed{color:var(--gold)}
.all{margin-top:10px;font-size:14px;color:var(--gold)}
.folders{margin-bottom:16px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.folders::-webkit-scrollbar{display:none}
.chips button{flex:none;padding:7px 14px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-size:14px;white-space:nowrap}
.chips button.on{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:600}
.osc{position:absolute;top:6px;left:6px;z-index:2;display:flex;flex-wrap:wrap;gap:1px;max-width:calc(100% - 30px);padding:3px 4px;border-radius:7px;background:rgba(11,13,18,.8)}
.osc svg{width:7px;height:16px;fill:#e2b84a}
.years{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 16px;padding:0 16px;scrollbar-width:none}
.years::-webkit-scrollbar{display:none}
.years button{flex:none;padding:7px 14px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-size:14px}
.years button.on{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:600}
.more{display:block;width:100%;margin:18px 0 8px;height:44px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:15px}
.seen2{position:absolute;top:6px;right:6px;z-index:2;display:grid;place-items:center;width:30px;height:22px;border-radius:11px;background:rgba(11,13,18,.82);color:#5fd39a}
.seen2 svg{width:20px;height:14px}
.seenbox{margin:14px -6px 4px;padding:10px 8px 0;border:1px solid rgba(95,211,154,.45);border-radius:16px;background:linear-gradient(180deg,rgba(95,211,154,.10),transparent 120px)}
.seenline{display:flex;align-items:center;gap:10px;margin:0 0 10px;color:#5fd39a;font-size:13px}
.seenline::before,.seenline::after{content:'';flex:1;height:1px;background:rgba(95,211,154,.35)}
.airbar{display:flex;justify-content:center;gap:8px;margin-bottom:14px}
.airbar button{padding:7px 14px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-size:14px}
.airbar button.on{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:600}
.ctry summary{list-style:none;display:flex;align-items:center;gap:10px;margin-top:10px;padding:12px 14px;border-radius:14px;background:var(--bg);border:1px solid var(--line);font-size:15px;cursor:pointer}
.ctry summary::-webkit-details-marker{display:none}
.ctry summary span:first-child{flex:1}
.ctry .chev{color:var(--muted);font-size:20px;transition:transform .2s}
.ctry[open] .chev{transform:rotate(90deg)}
.ctrylist{margin-top:8px;border-radius:14px;border:1px solid var(--line);overflow:hidden}
.ctrylist button{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;background:none;border:0;border-bottom:1px solid var(--line);font-size:15px;text-align:left;color:var(--text)}
.ctrylist button:last-child{border-bottom:0}
.ctrylist .fl{font-size:20px}
.ctrylist .nm{flex:1}
.ctrylist .ck{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line)}
.ctrylist button.on .nm{color:var(--muted);text-decoration:line-through}
.ctrylist .ck{display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700}
.ctrylist button.on .ck{background:#e5484d;border-color:#e5484d}
.ctrylist button.on .ck::after{content:'✕'}
.chips button.add{color:var(--muted);border-style:dashed}
.chips button.pen{display:grid;place-items:center;padding:0;width:40px}

<body>
<header><h1 id="title"></h1>
<button class="iconbtn" id="gear" aria-label="Настройки"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>

<button data-tab="want" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h12v18l-6-4-6 4z"/></svg>Посмотрю</button>

</nav>
<div id="toast"></div>

<input type="file" id="file" accept=".json,application/json" hidden>
<script>
const KEY = 'kino-data', TMDB = 'https://api.themoviedb.org/3', IMG = 'https://image.tmdb.org/t/p/';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let db = load(), tab = 'want', query = '', results = null, searchTimer;
// Перенос: досмотренные, но не завершённые сериалы — из «Просмотрено» в «Начал смотреть»
Object.values(db.items).forEach(i => { if (i.type === 'tv' && i.status === 'watched' && i.tvStatus && !/Ended|Canceled/.test(i.tvStatus)) i.status = 'watching'; });
const seg = { want: 'tv', watched: 'movie', lists: 'movie' }; // при открытии — «Посмотрю → Сериалы»
const pool = {}; // всё, что пришло из TMDB (поиск, подборки) — чтобы открыть карточку

function load() {
  try { const d = JSON.parse(localStorage.getItem(KEY)); if (d && d.items) return d; } catch {}
  return { key: '', items: {}, showsChecked: 0 };
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch { toast('Не удалось сохранить'); } }
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('on'), 2000); }
const uid = (type, id) => type + '-' + id;
const year = d => (d || '').slice(0, 4);
const poster = (p, size = 'w342') => p ? IMG + size + p : '';

// ---------- TMDB ----------
async function api(path, params = {}) {
  if (!db.key) throw new Error('nokey');
  const q = new URLSearchParams({ language: 'ru-RU', ...params });
  const opt = {};
  if (db.key.length > 40) opt.headers = { Authorization: 'Bearer ' + db.key }; else q.set('api_key', db.key);
  const r = await fetch(TMDB + path + '?' + q, opt);
  if (r.status === 401) throw new Error('badkey');
  if (!r.ok) throw new Error('net');
  return r.json();
}
function fromApi(x, type) {
  type = type || x.media_type;
  const it = { id: x.id, type, title: x.title || x.name || x.original_title || x.original_name, year: year(x.release_date || x.first_air_date), poster: x.poster_path || '', overview: x.overview || '', g: x.genre_ids || [], lang: x.original_language || '', date: x.release_date || x.first_air_date || '' };
  pool[uid(type, it.id)] = pool[uid(type, it.id)] || it;
  return it;
}
const DV = 13; // версия набора данных карточки: старые записи догружаются заново
const JOBS = { Director: 'Режиссёр', Screenplay: 'Сценарий', Writer: 'Сценарий', Novel: 'Автор книги', 'Original Music Composer': 'Композитор', 'Director of Photography': 'Оператор', Producer: 'Продюсер' };
// Жанры, актёры, съёмочная группа, сезоны — одним запросом
const BRANDS = /^(Netflix|Amazon|Apple|HBO|Max\b|Hulu|Disney|Paramount|Peacock|A24|Warner Bros|Universal Pictures|Columbia Pictures|Sony Pictures|Lionsgate|Neon|Searchlight|20th Century|Focus Features|Legendary|Lucasfilm|Pixar|Marvel Studios|DreamWorks|Blumhouse)/i;
async function loadDetails(it) {
  // У сериалов aggregate_credits — состав за все сезоны, а не только за последний
  const cr = it.type === 'tv' ? 'aggregate_credits' : 'credits';
  const d = await api('/' + it.type + '/' + it.id, { append_to_response: cr + ',videos' + (it.type === 'movie' ? ',release_dates' : ''), include_video_language: 'ru' });
  const credits = d[cr] || {};
  // Русский трейлер с YouTube: сначала трейлер, потом тизер, потом любое видео
  const vids = ((d.videos || {}).results || []).filter(v => v.site === 'YouTube' && v.iso_639_1 === 'ru');
  const tr = vids.find(v => v.type === 'Trailer') || vids.find(v => v.type === 'Teaser') || vids[0];
  it.yt = tr ? tr.key : '';
  if (it.type === 'movie') {
    // Дата проката в кино: Россия, иначе США, иначе самая ранняя премьера
    const rd = c => (((d.release_dates || {}).results || []).find(r => r.iso_3166_1 === c) || {}).release_dates || [];
    const th = c => (rd(c).find(x => x.type === 3) || rd(c).find(x => x.type === 2) || {}).release_date;
    const ru = th('RU'), us = th('US');
    it.release = (ru || us || d.release_date || '').slice(0, 10); it.releaseIn = ru ? '' : us ? 'США' : '';
    // Выход в сети (цифровой или на дисках) — самая ранняя дата по всем странам
    const dg = ((d.release_dates || {}).results || []).flatMap(r => r.release_dates).filter(x => x.type === 4 || x.type === 5).map(x => x.release_date.slice(0, 10)).sort();
    it.digital = dg[0] || '';
    it.mstatus = d.status || '';
  }
  it.genres = (d.genres || []).map(g => g.name); it.g = (d.genres || []).map(g => g.id); it.lang = d.original_language || it.lang || '';
  if (d.overview) it.overview = d.overview;
  // Кто снял и где: студии (до двух) и страны — по-русски
  // Главное — чей это проект: у сериала канал (Prime Video, Netflix…), у фильма крупный бренд, если он есть среди студий
  const st = (d.production_companies || []).map(c => ({ n: c.name, l: c.logo_path || '' }));
  const net = (d.networks || []).slice(0, 2).map(c => ({ n: c.name, l: c.logo_path || '', b: 1 }));
  const brand = st.filter(c => BRANDS.test(c.n)).map(c => ({ ...c, b: 1 }));
  it.studios = [...net, ...brand, ...st.filter(c => !BRANDS.test(c.n))].slice(0, 6);
  const cn = (d.production_countries || []).map(c => c.iso_3166_1).concat(d.origin_country || []);
  it.countries = [...new Set(cn)].slice(0, 3).map(c => ({ US: 'США', GB: 'Великобритания', KR: 'Южная Корея', AE: 'ОАЭ' })[c] || (() => { try { return new Intl.DisplayNames(['ru'], { type: 'region' }).of(c); } catch { return c; } })());
  if (d.poster_path) it.poster = d.poster_path;
  it.runtime = d.runtime || (d.episode_run_time || [])[0] || 0;
  it.cast = (credits.cast || []).slice(0, 15).map(p => ({ id: p.id, name: p.name, role: p.character || ((p.roles || [])[0] || {}).character || '', photo: p.profile_path || '' }));
  const crew = (d.created_by || []).map(p => ({ id: p.id, name: p.name, role: 'Создатель', photo: p.profile_path || '' }));
  const seen = new Set(crew.map(p => p.name + p.role)), producers = [];
  for (const p of credits.crew || []) {
    for (const job of p.job ? [p.job] : (p.jobs || []).map(j => j.job)) {
      const role = JOBS[job]; if (!role || seen.has(p.name + role)) continue;
      seen.add(p.name + role); (role === 'Продюсер' ? producers : crew).push({ id: p.id, name: p.name, role, photo: p.profile_path || '' });
    }
  }
  const order = Object.values(JOBS);
  crew.sort((a, b) => (a.role === 'Создатель' ? -1 : order.indexOf(a.role)) - (b.role === 'Создатель' ? -1 : order.indexOf(b.role)));
  it.crew = crew.slice(0, 10).concat(producers.slice(0, 2));
  if (it.type === 'tv') {
    const all = (d.seasons || []).filter(s => s.season_number > 0);
    const last = all[all.length - 1];
    // Пустой сезон оставляем, только если он последний и сериал не закончен — это объявленный сезон
    it.seasons = all.filter(s => s.episode_count > 0 || (s === last && !/Ended|Canceled/.test(d.status))).map(s => ({ n: s.season_number, count: s.episode_count, date: s.air_date || '' }));
    it.tvStatus = d.status || '';
    if (it.status === 'watched' && it.tvStatus && !tvDone(it)) it.status = 'watching';
    it.lastAir = d.last_air_date || '';
    const ne = d.next_episode_to_air;
    it.next = ne && ne.air_date ? { date: ne.air_date, s: ne.season_number, e: ne.episode_number } : null;
    // Расписание сезонов, которые ещё выходят или скоро выйдут, обновляем; старые храним как есть
    it.eps = it.eps || {};
    for (const s of it.seasons) if (!s.date || s.date > addDays(-150)) delete it.eps[s.n];
    const up = it.seasons.find(s => !aired(s)); if (up) await loadEps(it, up.n).catch(() => {});
  }
  it.details = Date.now(); it.dv = DV;
}

async function loadEps(it, n) {
  const d = await api('/tv/' + it.id + '/season/' + n);
  (it.eps = it.eps || {})[n] = (d.episodes || []).map(e => ({ e: e.episode_number, d: e.air_date || '', t: e.name || '', m: e.runtime || 0 }));
  const s = (it.seasons || []).find(x => x.n === n); if (s && it.eps[n].length > s.count) s.count = it.eps[n].length;
}

// ---------- Обложки в памяти телефона ----------
async function cachePoster(p) {
  if (!p || !('caches' in window)) return;
  const url = poster(p);
  try {
    const c = await caches.open('kino-posters');
    if (await c.match(url)) return;
    // reload: копия картинки из обычного кэша браузера не годится для сохранения (нет CORS-заголовка)
    const r = await fetch(url, { mode: 'cors', cache: 'reload' });
    if (r.ok) await c.put(url, r);
  } catch {}
}
async function dropPoster(p) { if (p && 'caches' in window) try { (await caches.open('kino-posters')).delete(poster(p)); } catch {} }
async function syncAll() {
  if (!navigator.onLine) return;
  for (const it of Object.values(db.items)) await cachePoster(it.poster);
  if (!db.key) return;
  // Догружаем жанры и актёров, где их нет; раз в сутки обновляем сезоны — появятся новые серии
  const daily = Date.now() - (db.showsChecked || 0) > 864e5;
  for (const it of Object.values(db.items)) {
    if (!it.details || it.dv !== DV || (daily && it.status !== 'watched' && (it.type === 'tv' || noHQ(it)))) { try { await loadDetails(it); } catch {} }
    // Для статистики: точная длительность просмотренных серий (одна загрузка на сезон)
    if (it.type === 'tv') for (const sn of Object.keys(it.seen || {})) {
      if ((it.seen[sn] || []).length && !((it.eps || {})[sn] || []).some(x => 'm' in x)) { try { await loadEps(it, +sn); } catch {} }
    }
  }
  if (daily) db.showsChecked = Date.now();
  save(); if (!stack.length) refreshMain();
}

// ---------- Сериалы: прогресс ----------
const today = () => new Date().toISOString().slice(0, 10);
const aired = s => s.date === undefined || (s.date && s.date <= today()); // у старых записей даты нет — считаем вышедшим
const airedSeasons = it => (it.seasons || []).filter(aired);
// Сколько серий сезона уже вышло: по расписанию, если оно загружено
const airedCount = (it, s) => { const eps = (it.eps || {})[s.n]; return eps ? eps.filter(x => x.d && x.d <= today()).length : s.count; };
const total = it => airedSeasons(it).reduce((a, s) => a + airedCount(it, s), 0);
const seenCount = it => Object.values(it.seen || {}).reduce((a, e) => a + e.length, 0);
function nextEp(it) {
  for (const s of airedSeasons(it)) { const seen = (it.seen || {})[s.n] || []; for (let e = 1; e <= airedCount(it, s); e++) if (!seen.includes(e)) return { s: s.n, e }; }
  return null;
}
// Статус сериала: цвет точки и строка «когда дальше»
const MONTHS = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
const MONTHS1 = ['январь', 'февраль', 'март', 'апрель', 'май', 'июнь', 'июль', 'август', 'сентябрь', 'октябрь', 'ноябрь', 'декабрь'];
function fmtDate(d, short) {
  if (!d) return '';
  const [y, m, day] = d.split('-').map(Number), thisYear = y === new Date().getFullYear();
  return short ? MONTHS1[m - 1] + ' ' + y : day + ' ' + MONTHS[m - 1] + (thisYear ? '' : ' ' + y);
}
const MSH = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
function fmtShort(d) { const [y, m, day] = d.split('-').map(Number); return day + ' ' + MSH[m - 1] + (y === new Date().getFullYear() ? '' : ' ' + y); }
// Список серий сезона с датами. Пока расписание не загружено — сетка номеров, как раньше
const epsLoading = new Set();
async function fetchEps(it, n) {
  const k = it.id + ':' + n; if (epsLoading.has(k)) return; epsLoading.add(k);
  try { await loadEps(it, n); if (db.items[uid('tv', it.id)]) save(); if (cur === it) renderSheet(); } catch {}
  epsLoading.delete(k);
}
function epsHtml(it, s, seen) {
  const eps = (it.eps || {})[s.n];
  if (!eps) {
    if (openSeason === s.n && navigator.onLine && db.key) fetchEps(it, s.n);
    if (!aired(s)) return `<p class="hint">${navigator.onLine && db.key ? 'Загружаю серии…' : 'Список серий появится при интернете.'}</p>`;
    return `<div class="epgrid">${Array.from({ length: s.count }, (_, i) => `<button data-ep="${s.n}:${i + 1}" class="${seen.includes(i + 1) ? 'on' : ''}">${i + 1}</button>`).join('')}</div>`;
  }
  if (!eps.length) return `<p class="hint">Серии ещё не объявлены.</p>`;
  return `<div class="eplist">${eps.map(x => {
    const ok = x.d && x.d <= today(), on = seen.includes(x.e), name = /^(эпизод|серия|episode)\s*\d+$/i.test(x.t) ? '' : x.t;
    return `<button class="ep${on ? ' on' : ''}${ok ? '' : ' future'}" ${ok ? `data-ep="${s.n}:${x.e}"` : 'disabled'}><i class="chk"></i><span class="en"><b>${x.e}</b>${name ? esc(name) : ''}</span><span class="ed">${x.d ? fmtShort(x.d) : 'дата ?'}</span></button>`;
  }).join('')}</div>`;
}
function tvState(it) {
  if (it.type !== 'tv' || !it.dv) return null;
  const n = airedSeasons(it).length, first = it.year, lastY = (it.lastAir || '').slice(0, 4);
  const span = n + ' ' + plural(n, 'сезон', 'сезона', 'сезонов') + (first ? ', ' + first + (lastY && lastY !== first ? '–' + lastY : '') : '');
  if (it.tvStatus === 'Ended') return { c: 'end', t: 'Завершён · ' + span };
  if (it.tvStatus === 'Canceled') return { c: 'end', t: 'Закрыт · ' + span };
  const nx = it.next;
  if (nx && nx.e > 1 && nx.date <= addDays(14)) return { c: 'live', t: 'Выходит · серия ' + nx.e + ' — ' + fmtDate(nx.date) };
  const up = (it.seasons || []).find(s => !aired(s));
  if (nx && nx.e === 1) return { c: 'wait', t: 'Сезон ' + nx.s + ' · ' + fmtDate(nx.date) };

  // Окно карточки помнит прежний объект — переводим его на новый, иначе кнопка «Посмотрю» не погаснет
  stack.forEach(l => { if (l.it === it) l.it = cur; });
  renderSheet(); toast('Убрано из списков');
}
function setStatus(st) {
  const it = cur;
  const active = it.status === st || (st === 'want' && it.status === 'watching');
  if (active && db.items[uid(it.type, it.id)]) {
    if (seenCount(it)) ask({ title: 'Убрать из списков?', text: `Отметки серий «${it.title}» тоже удалятся.`, ok: 'Убрать', danger: true }).then(yes => { if (yes && cur === it) removeItem(it); });
    else removeItem(it);
    return;
  }
  it.status = st;
  if (st === 'watched') {
    it.watchedAt = Date.now();
    if (it.type === 'tv' && it.seasons) { it.seen = {}; airedSeasons(it).forEach(s => it.seen[s.n] = Array.from({ length: airedCount(it, s) }, (_, i) => i + 1)); }
  }
  if (st === 'want' && it.type === 'tv') it.seen = {};
  keep(it); renderSheet(); toast(st === 'want' ? 'Добавлено в «Посмотрю»' : 'Отмечено как просмотренное');
}
function toggleEp(it, s, e) {
  it.seen = it.seen || {}; const a = it.seen[s] = it.seen[s] || [];
  const i = a.indexOf(e); if (i >= 0) a.splice(i, 1); else a.push(e);
  if (!it.status) it.status = 'want';
  afterEpisodes(it); keep(it);
}

// ---------- Настройки ----------
// ---------- Статистика просмотренного ----------
function stats() {
  let movieMin = 0, showMin = 0, movies = 0, eps = 0, approx = false;
  const actors = {}, makers = {};
  const add = (map, p, it) => { const k = p.id || p.name; (map[k] = map[k] || { ...p, n: 0, seen: new Set() }); if (!map[k].seen.has(uid(it.type, it.id))) { map[k].seen.add(uid(it.type, it.id)); map[k].n++; } };
  for (const it of Object.values(db.items)) {
    if (hiddenMine(it)) continue;
    if (it.type === 'movie') {
      if (it.status !== 'watched') continue;
      movies++; movieMin += it.runtime || 0; if (!it.runtime) approx = true;
    } else {
      // Серии: длительность из расписания сезона, иначе средняя серия сериала, иначе 45 минут
      let n = 0;
      for (const [sn, list] of Object.entries(it.seen || {})) for (const e of list) {
        const m = (((it.eps || {})[sn] || []).find(x => x.e === e) || {}).m || it.runtime || 0;
        if (!m) approx = true; showMin += m || 45; n++;
      }
      if (!n) continue; eps += n;
    }
    (it.cast || []).slice(0, 10).forEach(p => add(actors, p, it));
    (it.crew || []).filter(p => p.role === 'Режиссёр' || p.role === 'Создатель').forEach(p => add(makers, p, it));
  }
  const top = m => Object.values(m).filter(p => p.n >= 2).sort((a, b) => b.n - a.n).slice(0, 10);
  return { movieMin, showMin, movies, eps, approx, actors: top(actors), makers: top(makers) };
}
function statsHtml() {
  const st = stats(), total = st.movieMin + st.showMin;
  const hm = m => Math.floor(m / 60).toLocaleString('ru') + ' ч' + (m % 60 ? ' ' + m % 60 + ' мин' : '');
  const fmtN = (n, a, b, c) => n.toLocaleString('ru') + ' ' + plural(n, a, b, c);
  if (!st.movies && !st.eps) return `<div class="card"><p style="margin:0">Статистика появится, когда отметишь просмотренные фильмы или серии.</p></div>`;
  const ppl = list => people(list.map(p => ({ ...p, role: fmtN(p.n, 'просмотр', 'просмотра', 'просмотров') })));
  return `<div class="card stats"><p>Моя статистика${st.approx ? ' · примерно' : ''}</p>
    <div class="big">${Math.round(total / 60).toLocaleString('ru')}<span> ${plural(Math.round(total / 60), 'час', 'часа', 'часов')}</span></div>
    <div class="sub">${total.toLocaleString('ru')} ${plural(total, 'минута', 'минуты', 'минут')} · ${(total / 1440).toFixed(1).replace('.', ',')} суток</div>
    <div class="sgrid"><div><b>${st.movies}</b><span>${plural(st.movies, 'фильм', 'фильма', 'фильмов')} · ${hm(st.movieMin)}</span></div><div><b>${st.eps}</b><span>${plural(st.eps, 'серия', 'серии', 'серий')} · ${hm(st.showMin)}</span></div></div>
    ${st.actors.length ? `<div class="sec">Любимые актёры</div>${ppl(st.actors)}` : ''}
    ${st.makers.length ? `<div class="sec">Любимые режиссёры и создатели</div>${ppl(st.makers)}` : ''}
    ${!st.actors.length && !st.makers.length ? `<p style="margin:18px 0 0">Любимые актёры и режиссёры появятся, когда кто-то встретится хотя бы в двух просмотренных фильмах или сериалах.</p>` : ''}</div>`;
}

  <div class="card"><p>Спрятанные фильмы и сериалы${hid.length ? ' · ' + hid.length : ''}</p>${hid.length ? hid.map(x => `<div class="hrow"><span>${esc(x.title)}<small>${x.year || ''}${x.type === 'tv' ? ' · сериал' : ''}</small></span><button data-unhide="${uid(x.type, x.id)}">Вернуть</button></div>`).join('') : '<p style="margin:0">Пока ничего. Спрятать можно кнопкой внизу карточки.</p>'}</div>
  <div class="card"><p>В списках ${n}. ${est}</p><p>Все данные хранятся только на этом телефоне. Если удалить иконку приложения, они пропадут — поэтому иногда сохраняй копию (например, в iCloud Drive).</p>
  <button class="wide" id="exp">Сохранить копию</button><button class="wide" id="imp">Восстановить из копии</button></div>
  <p style="color:var(--muted);font-size:12px;text-align:center;line-height:1.5"><span id="ver"></span>Данные о фильмах: TMDB. Это приложение использует TMDB API, но не одобрено и не сертифицировано TMDB.</p></div>`;
  L.el.scrollTop = y;
  // Какая версия сейчас на телефоне — по названию кэша (чтобы проверить, дошло ли обновление)
  caches.keys().then(k => { const v = k.find(x => /^kino-v\d+$/.test(x)), el = L.el.querySelector('#ver'); if (v && el) el.textContent = 'Версия ' + v.slice(6) + '. '; }).catch(() => {});
}
async function exportData() {
  const data = JSON.stringify({ app: 'kino', saved: new Date().toISOString(), items: db.items, folders: db.folders || [], hiddenItems: db.hiddenItems || {}, offGenres: db.offGenres || [], offLangs: db.offLangs || [], allStudios: !!db.allStudios }, null, 1);
  const name = 'kino-' + new Date().toISOString().slice(0, 10) + '.json';
  const file = new File([data], name, { type: 'application/json' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file] }); return; } catch (e) { if (e.name === 'AbortError') return; } }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
$('#file').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!d.items || typeof d.items !== 'object') throw 0;
    if (!await ask({ title: 'Восстановить из копии?', text: `${Object.keys(d.items).length} записей. Текущие списки заменятся.`, ok: 'Восстановить', danger: true })) return;
    db.items = d.items; if (d.folders) db.folders = d.folders; if (d.hiddenItems) db.hiddenItems = d.hiddenItems; if (d.offGenres) db.offGenres = d.offGenres; if (d.offLangs) db.offLangs = d.offLangs; if (d.allStudios !== undefined) db.allStudios = d.allStudios; save(); closeSheet(); syncAll(); toast('Восстановлено');
  } catch { toast('Это не файл копии'); }
});

// ---------- Нажатия ----------
document.querySelector('nav').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setTab(b.dataset.tab); });
$('#gear').addEventListener('click', openSettings);
$('#main').addEventListener('click', e => {
  const fb = e.target.closest('[data-folder]');
  if (fb) { const v = fb.dataset.folder;
    if (v === 'edit') return editFolder();
    if (v === 'new') { newFolder().then(f => { if (f) { folderSel[tab] = f.id; render(); toast('Подборка создана'); } }); return; }
    folderSel[tab] = v || null;
    const y = scrollY; render(); scrollTo(0, y); return; }
  const ab = e.target.closest('[data-air]'); if (ab) { airF = airF === ab.dataset.air ? 'all' : ab.dataset.air; try { localStorage.setItem('kino-air', airF); } catch {} const y = scrollY; render(); scrollTo(0, y); return; }
  const sg = e.target.closest('[data-seg]'); if (sg) { seg[tab] = sg.dataset.seg; const y = scrollY; render(); scrollTo(0, y); return; }
  if (e.target.closest('[data-mkcol]')) return createCollection();
  const cl = e.target.closest('[data-col]'); if (cl && cl.dataset.noclick) return; if (cl) { const v = cl.dataset.col; return openCollection(/^\d+$/.test(v) ? +v : v); }
  if (e.target.closest('[data-oscar]')) return openOscar();
  const nx = e.target.closest('[data-next]');
  if (nx) { const it = db.items['tv-' + nx.dataset.next], n = nextEp(it); if (n) { toggleEp(it, n.s, n.e); toast(`Сезон ${n.s}, серия ${n.e} — просмотрена`); render(); } return; }
  const o = e.target.closest('[data-open]'); if (o) openItem(o.dataset.open);
});
function layerClick(e, L) {
  const t = e.target.closest('button'); if (!t) return;
  if (t.classList.contains('close')) return popLayer(L);
  if (t.dataset.open) return openItem(t.dataset.open);
  if (t.dataset.pname !== undefined) return openPerson(+t.dataset.pid || 0, t.dataset.pname);
  if (L.onButton) return L.onButton(t);
  if (L.kind !== 'item' && L.kind !== 'settings') return;
  if (t.id === 'savekey') { db.key = $('#key').value.trim(); db.showsChecked = 0; db.disc = null; save(); results = null; toast('Ключ сохранён'); syncAll(); return; }
  if (t.id === 'exp') return exportData();
  if (t.id === 'imp') return $('#file').click();
  if (t.dataset.tofolder) {
    const id = uid(cur.type, cur.id), it = cur;
    if (t.dataset.tofolder === 'new') { newFolder().then(f => { if (!f) return; f.items.push(id); save(); if (cur === it) renderSheet(); toast(`Добавлено в «${f.name}»`); }); return; }
    const f = (db.folders || []).find(x => x.id === t.dataset.tofolder); if (!f) return;
    const i = f.items.indexOf(id); if (i >= 0) f.items.splice(i, 1); else f.items.push(id);
    save(); renderSheet(); return;
  }
  if (t.id === 'similar') return openSimilar(cur);
  if (t.id === 'hide') {
    const id = uid(cur.type, cur.id); db.hiddenItems = db.hiddenItems || {};
    if (db.hiddenItems[id]) { delete db.hiddenItems[id]; save(); toast('Возвращено'); renderSheet(); return; }
    const it = cur;
    ask({ title: 'Спрятать?', text: `«${it.title}» пропадёт отовсюду. Вернуть можно в настройках.`, ok: 'Спрятать' }).then(yes => {
      if (!yes) return;
      db.hiddenItems[id] = { id: it.id, type: it.type, title: it.title, year: it.year, poster: it.poster, at: Date.now() };
      save(); closeSheet(); toast('Спрятано');
      // Сразу убираем со всех открытых экранов: поиск, подборки, коллекции, похожие
      document.querySelectorAll(`.tile[data-open="${id}"]`).forEach(b => b.remove());
      if (!stack.length) refreshMain();
    }); return;
  }
  if (t.dataset.unhide) { delete db.hiddenItems[t.dataset.unhide]; save(); openSettings(); return; }
  if (t.dataset.order) { db.watchingFirst = t.dataset.order === '1'; save(); t.parentNode.querySelectorAll('[data-order]').forEach(b => b.classList.toggle('on', b === t)); refreshMain(); return; }
  if (t.dataset.show) { const k = t.dataset.show; db[k] = !db[k]; save(); t.classList.toggle('on', !db[k]); refreshMain(); return; }
  if (t.dataset.allstud) { db.allStudios = !db.allStudios; save(); t.querySelector('.sw').classList.toggle('on', db.allStudios); return; }
  if (t.dataset.ctry) { const k = t.dataset.ctry, off = db.offLangs = db.offLangs || [], i = off.indexOf(k); if (i >= 0) off.splice(i, 1); else off.push(k); save(); results = null; colMix = {}; t.classList.toggle('on'); t.closest('details').querySelector('[data-ctrysum]').textContent = ctrySum(); return; }
  if (t.dataset.genre) { const k = t.dataset.genre, off = db.offGenres = db.offGenres || [], i = off.indexOf(k); if (i >= 0) off.splice(i, 1); else off.push(k); save(); results = null; t.classList.toggle('on'); return; }
  if (t.dataset.st) return setStatus(t.dataset.st);
  if (t.dataset.season) { const n = +t.dataset.season; openSeason = openSeason === n ? null : n; renderSheet(); return; }
  if (t.dataset.ep) { const [s, ep] = t.dataset.ep.split(':').map(Number); toggleEp(cur, s, ep); renderSheet(); return; }
  if (t.dataset.all) markSeason(+t.dataset.all);
}
// Отметить сезон целиком (on = undefined — переключить)
function markSeason(s, force) {
  {
    const ac = airedCount(cur, cur.seasons.find(x => x.n === s)); cur.seen = cur.seen || {};
    const on = force === undefined ? (cur.seen[s] || []).length < ac : force;
    cur.seen[s] = on ? Array.from({ length: ac }, (_, i) => i + 1) : [];
    // Отметил весь сезон — значит, видел и все прошлые (кроме спецвыпусков, сезон 0); снятие отметки прошлые не трогает
    if (on && s > 1) airedSeasons(cur).filter(x => x.n >= 1 && x.n < s).forEach(x => cur.seen[x.n] = Array.from({ length: airedCount(cur, x) }, (_, i) => i + 1));
    if (!cur.status) cur.status = 'want';
    afterEpisodes(cur); keep(cur); renderSheet();
  }
}

// ---------- Смахнуть сезон влево — отмечены все серии ----------
{
  let h = null, x0 = 0, y0 = 0, dx = 0, horiz = null;
  document.addEventListener('touchstart', e => { h = e.target.closest('.season:not(.soon) .head'); if (!h) return; x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; dx = 0; horiz = null; }, { passive: true });
  document.addEventListener('touchmove', e => {
    if (!h) return; dx = Math.min(0, e.touches[0].clientX - x0); const dy = e.touches[0].clientY - y0;
    if (horiz === null && (Math.abs(e.touches[0].clientX - x0) > 8 || Math.abs(dy) > 8)) horiz = Math.abs(e.touches[0].clientX - x0) > Math.abs(dy);
    if (!horiz) return; e.preventDefault();
    h.parentNode.classList.add('swiping'); h.parentNode.style.setProperty('--hh', h.offsetHeight + 'px'); h.style.transform = `translateX(${dx}px)`;
    h.parentNode.classList.toggle('ready', dx < -h.offsetWidth * 0.3);
  }, { passive: false });
  document.addEventListener('touchend', () => {
    if (!h) return; const el = h, ok = horiz && dx < -el.offsetWidth * 0.3; h = null;
    if (horiz) { lpFired = Date.now(); } // отпускание не должно раскрывать сезон
    el.style.transform = ''; el.parentNode.classList.remove('swiping', 'ready');
    if (ok && cur) { markSeason(+el.dataset.season, true); toast('Сезон ' + el.dataset.season + ' отмечен'); }
  }, { passive: true });
}
// ---------- Свайп вниз закрывает окно ----------
function swipeClose(el, close) {
  let y0 = null, dy = 0;
  el.addEventListener('touchstart', e => { if (el.scrollTop <= 0 && el.classList.contains('open')) { y0 = e.touches[0].clientY; dy = 0; } else y0 = null; }, { passive: true });
  el.addEventListener('touchmove', e => {
    if (y0 === null) return;
    dy = e.touches[0].clientY - y0;
    if (dy <= 0 || el.scrollTop > 0) { el.classList.remove('dragging'); el.style.transform = ''; if (dy < 0) y0 = null; return; }
    e.preventDefault(); el.classList.add('dragging'); el.style.transform = `translateY(${dy}px)`;
  }, { passive: false });
  el.addEventListener('touchend', () => {
    if (y0 === null) return; y0 = null; el.classList.remove('dragging');
    if (dy > 110) { el.style.transform = 'translateY(100%)'; setTimeout(() => { close(); el.style.transform = ''; }, 250); } else el.style.transform = '';
  });
}
// ---------- Свайп справа налево закрывает подборку, «Похожие», актёра ----------
function swipeSide(el, close) {
  let x0 = null, y0 = 0, dx = 0, horiz = null;
  el.addEventListener('touchstart', e => { x0 = e.target.closest('.scroller, .folders, [data-swp]') ? null : e.touches[0].clientX; y0 = e.touches[0].clientY; dx = 0; horiz = null; }, { passive: true });
  el.addEventListener('touchmove', e => {
    if (x0 === null) return;
    dx = e.touches[0].clientX - x0; const dy = e.touches[0].clientY - y0;
    if (horiz === null && (Math.abs(dx) > 10 || Math.abs(dy) > 10)) horiz = Math.abs(dx) > Math.abs(dy) * 1.5 && dx < 0;
    if (!horiz) return;
    e.preventDefault(); el.classList.add('dragging'); el.style.transform = `translateX(${Math.min(dx, 0)}px)`;
  }, { passive: false });
  el.addEventListener('touchend', () => {
    if (x0 === null || !horiz) { x0 = null; return; } x0 = null; el.classList.remove('dragging');
    if (dx < -innerWidth * 0.3) { el.style.transform = 'translateX(-100%)'; setTimeout(close, 250); } else el.style.transform = '';
  });
}
addEventListener('online', () => { syncAll(); if (tab === 'search') doSearch(); if (tab === 'lists') refreshMain(); });
addEventListener('offline', () => { if (tab === 'search') renderResults(); });

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
render(); syncAll();
